Main:
  NEvents: 500000
  HardCuts: False
  EventCuts: false
  DoRotate: false
  RunDecays: False

SherpaOptions:
  MODEL: ChiPT_UFO
  UFO_PARAM_CARD: param_card.dat
  # The UFO has no eta or kaons; keep Sherpa's default entries stable so the
  # Achilles cascade does not look for their decays.
  PARTICLE_DATA:
    221: {Mass: 0.547862, Width: 0.0, Stable: 1}
    311: {Mass: 0.497677, Width: 0.0, Stable: 1}
    321: {Mass: 0.493677, Width: 0.0, Stable: 1}

Processes:
  - Leptons: [14, [13]]

Beams:
  - Beam:
      PID: 14
      Beam Params:
        Type: Spectrum
        Histogram: flux/T2K_nu.dat

Cascade:
  Run: True
  Interactions: !include "data/default/VirtResInteractions.yml"
  Step: 0.04
  Probability: Cylinder
  InMedium: None
  PotentialProp: False
  Algorithm: Base

NuclearModels:
  - NuclearModel:
      Model: QESpectral
      FormFactorFile: "FormFactors.yml"
      SpectralP: data/Spectral_Functions/pke12p_tot.data
      SpectralN: data/Spectral_Functions/pke12n_tot.data
      Ward: None
  - NuclearModel:
      Model: FortranModel
      Name: RES_Spectral_Func
      FormFactorFile: "FormFactors.yml"
      ConfigFile: data/info_C12_pke.data
      Ward: None

Nuclei:
  - Nucleus: !include "data/default/12C.yml"
  - Nucleus: !include "data/default/1H.yml"

HardCuts:
  - Type: AngleTheta
    PIDs: 13
    range: [0., 180.]

Options: !include "data/default/OptionDefaults.yml"

Backend:
  Name: SherpaFull
  Options:
    FormFactorFile: "FormFactors.yml"
