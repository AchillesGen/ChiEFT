# Inclusive e-16O at 880 MeV, 32 deg (Anghinolfi:1996vm) -- the one non-carbon target
# in the Durham set that Achilles ships a spectral function for.
#
# NUISANCE's Durham samples accept |theta_e - theta_0| < Electron_NThetaBins *
# Electron_ThetaWidth = 4 deg, so the generation cut below is that window with a
# 1 deg margin. It is deliberately tight: the EM cross section grows like
# 1/sin^4(theta/2), and opening the cut up would spend the run forward of the
# measured angles.
Main:
  NEvents: 500000
  HardCuts: True
  EventCuts: false
  DoRotate: false
  RunDecays: False

SherpaOptions:
  MODEL: ChiPT_UFO
  UFO_PARAM_CARD: param_card.dat
  # The UFO has no eta or kaons; keep Sherpa's default entries stable so the
  # Achilles cascade does not look for their decays.
  PARTICLE_DATA:
    221: {Mass: 0.547862, Width: 0.0, Stable: 1}
    311: {Mass: 0.497677, Width: 0.0, Stable: 1}
    321: {Mass: 0.493677, Width: 0.0, Stable: 1}

Processes:
  - Leptons: [11, [11]]

Beams:
  - Beam:
      PID: 11
      Beam Params:
        Type: Monochromatic
        Energy: 880

Cascade:
  Run: True
  Interactions: !include "data/default/VirtResInteractions.yml"
  Step: 0.04
  Probability: Cylinder
  InMedium: None
  PotentialProp: False
  Algorithm: Base

NuclearModels:
  - NuclearModel:
      Model: QESpectral
      FormFactorFile: "FormFactors.yml"
      SpectralP: data/Spectral_Functions/pke16p_tot.data
      SpectralN: data/Spectral_Functions/pke16n_tot.data
      Ward: None
  - NuclearModel:
      Model: FortranModel
      Name: RES_Spectral_Func
      FormFactorFile: "FormFactors.yml"
      ConfigFile: data/info_O16_pke.data
      Ward: None

# data/default/16O.yml names data/densities/rho_O_P_IAFDMC.txt, but the shipped
# file is rho_O_p_IAFDMC.txt -- the include would not resolve, so 16O is inline.
Nuclei:
  - Nucleus:
      Name: 16O
      Binding: 8.6
      Fermi Momentum: 228
      Density:
        ProtonFile: data/densities/rho_O_p_IAFDMC.txt
        NeutronFile: data/densities/rho_O_n_IAFDMC.txt
        FilePotential: data/realOP_12C_EDAI.dat
        Function: configuration
        Configs: data/configurations/16O_IAFDMC_configs.out.gz
      FermiGas:
        Type: Local
        Correlated: False
        SRCfraction: 0.2
        LambdaSRC: 2.75
        Params: []
      Potential:
        Name: Schroedinger
        r0: 0.16
        Mode: 3

HardCuts:
  - Type: AngleTheta
    PIDs: 11
    range: [27., 37.]

Options: !include "data/default/OptionDefaults.yml"

Backend:
  Name: SherpaFull
  Options:
    FormFactorFile: "FormFactors.yml"
